### DOCKER COMPOSE FOR AUDIOBOOKSHELF-SONOS ###
#
# IMPORTANT: Docker Desktop Limitations
# =====================================
# Docker Desktop (Windows/macOS) runs containers inside a VM, which means:
# 1. Sonos SSDP discovery will NOT work - speakers must be configured manually
# 2. You must set SONOS_SERVER_URL to your host machine's LAN IP (e.g., 192.168.1.x)
#
# For full Sonos auto-discovery, run on native Linux Docker with network_mode: host
# (see commented alternative configuration below)
#
services:
  # Sonos HTTP API - bridge between Audiobookshelf and Sonos speakers
  # NOTE: Without host networking, SSDP speaker discovery is disabled.
  #       Configure speakers manually in the sonos-http-api settings.
  sonos-api:
    build: ./sonos-http-api
    container_name: sonos-api
    ports:
      - "5005:5005"
    networks:
      - abs-network
    restart: unless-stopped
    # FOR NATIVE LINUX DOCKER with auto-discovery, uncomment below and remove ports/networks:
    # network_mode: host

  audiobookshelf:
    build: .
    container_name: audiobookshelf
    ports:
      - "13378:13378"
    networks:
      - abs-network
    environment:
      - PORT=13378
      # URL for audiobookshelf to reach sonos-api (container-to-container)
      - SONOS_API_URL=http://sonos-api:5005
      # URL for Sonos speakers to reach audiobookshelf (must be your LAN IP!)
      # REQUIRED: Change 192.168.1.x to your actual host machine IP
      - SONOS_SERVER_URL=http://192.168.1.x:13378
    volumes:
      # These volumes are needed to keep your library persistent
      # and allow media to be accessed by the ABS server.
      # The path to the left of the colon is the path on your computer,
      # and the path to the right of the colon is where the data is
      # available to ABS in Docker.
      # You can change these media directories or add as many as you want
      - ./audiobooks:/audiobooks
      - ./podcasts:/podcasts
      # The metadata directory can be stored anywhere on your computer
      - ./metadata:/metadata
      # The config directory needs to be on the same physical machine
      # you are running ABS on
      - ./config:/config
    restart: unless-stopped
    depends_on:
      - sonos-api
    # You can use the following user directive to run the ABS
    # docker container as a specific user. You will need to change
    # the UID and GID to the correct values for your user.
    # user: 1000:1000

networks:
  abs-network:
    driver: bridge

